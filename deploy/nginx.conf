# Шаблон: замените justask.example.edu и пути к сертификатам на свои.
# Терминируем TLS здесь. Заголовок X-Forwarded-Proto обязателен для подписи LTI.

server {
    listen 80;
    server_name justask.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name justask.example.edu;

    ssl_certificate     /etc/letsencrypt/live/justask.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justask.example.edu/privkey.pem;

    # Лимит загрузки чуть больше, чем MAX_UPLOAD_SIZE (50 МБ) в приложении.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE: без буферизации и с длинным read-timeout, иначе поток оборвётся.
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
